<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Iniciar Sesión - Hello Kitty</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">hello kitty</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="error.html">Servicios</a></li>
                <li><a href="error.html">Nosotros</a></li>
                <li><a href="login.html" class="active-link">Iniciar sesión</a></li>
            </ul>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>
            <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <div id="loginMessage" class="form-message"></div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
