<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea carrusel autonomo </title>
</head>
<body>

<div class="carousel-container">
    <div class="carousel-track" id="track">
      <div class="slide">
        <img src="imagenes/images (1).jpg" alt="Foto 1">
      </div>
      <div class="slide">
        <img src="imagenes/images.jpg" alt="Foto 2">
      </div>
      <div class="slide">
        <img src="imagenes/images (2).jpg" alt="Foto 3">
      </div>
    </div>

    <!-- Indicadores (puntos) -->
    <div class="carousel-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
  <script src="app.js"></script> 
</body>
</html>
